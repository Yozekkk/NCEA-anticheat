name: Java 17 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Paper 1.20 / 1.20.1
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run JUnit and build both artifacts
        run: ./gradlew clean build --no-daemon
      - name: Verify both Paper archives
        shell: bash
        run: |
          test -s dist/NCEA-AntiCheat-1.20.jar
          test -s dist/NCEA-AntiCheat-1.20.1.jar
          unzip -t dist/NCEA-AntiCheat-1.20.jar | tail -1
          unzip -t dist/NCEA-AntiCheat-1.20.1.jar | tail -1
      - name: Upload development artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ncea-anticheat-development
          path: dist/NCEA-AntiCheat-*.jar
          if-no-files-found: error
