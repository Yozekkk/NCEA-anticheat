<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 135" role="img" aria-label="NCEA AntiCheat artwork">
<defs><linearGradient id="panel" x2="1" y2="1"><stop stop-color="#070914"/><stop offset="1" stop-color="#101638"/></linearGradient>
<linearGradient id="stroke"><stop stop-color="#5555FF"/><stop offset=".55" stop-color="#8358FF"/><stop offset="1" stop-color="#35D5FF"/></linearGradient>
<filter id="glow" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>*{box-sizing:border-box} .glow{filter:url(#glow)} .pulse{animation:pulse 6s ease-in-out infinite}
    .scan{animation:scan 8s linear infinite} .rain{animation:rain 9s linear infinite}
    .reveal{animation:reveal 1.8s ease-out both}
    @keyframes pulse{50%{opacity:.48}} @keyframes scan{to{transform:translateY(135px)}}
    @keyframes rain{to{transform:translateY(135px)}}
    @keyframes reveal{from{opacity:.45;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){.pulse,.scan,.rain,.reveal{animation:none!important}}
    </style>
<rect width="1200" height="135" rx="20" fill="url(#panel)"/>
