<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 46" role="img" aria-label="NCEA AntiCheat artwork">
<defs><linearGradient id="panel" x2="1" y2="1"><stop stop-color="#070914"/><stop offset="1" stop-color="#101638"/></linearGradient>
<linearGradient id="stroke"><stop stop-color="#5555FF"/><stop offset=".55" stop-color="#8358FF"/><stop offset="1" stop-color="#35D5FF"/></linearGradient>
<filter id="glow" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>*{box-sizing:border-box} .glow{filter:url(#glow)} .pulse{animation:pulse 6s ease-in-out infinite}
    .scan{animation:scan 8s linear infinite} .rain{animation:rain 9s linear infinite}
    .reveal{animation:reveal 1.8s ease-out both}
    @keyframes pulse{50%{opacity:.48}} @keyframes scan{to{transform:translateY(46px)}}
    @keyframes rain{to{transform:translateY(46px)}}
    @keyframes reveal{from{opacity:.45;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){.pulse,.scan,.rain,.reveal{animation:none!important}}
    </style>
<rect width="1200" height="46" rx="20" fill="url(#panel)"/>
<path d="M0 23H1200" stroke="url(#stroke)" stroke-width="2" opacity=".55"/><path d="M445 23h310" stroke="#35D5FF" stroke-width="3" class="pulse glow"/><text x="600" y="17" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="3">N C E A   /   A C</text><g class="rain"><text x="40" y="40" fill="#35D5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="9" font-weight="400" opacity=".45">0101</text><text x="190" y="40" fill="#35D5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="9" font-weight="400" opacity=".45">0101</text><text x="340" y="40" fill="#35D5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="9" font-weight="400" opacity=".45">0101</text><text x="490" y="40" fill="#35D5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="9" font-weight="400" opacity=".45">0101</text><text x="640" y="40" fill="#35D5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="9" font-weight="400" opacity=".45">0101</text><text x="790" y="40" fill="#35D5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="9" font-weight="400" opacity=".45">0101</text><text x="940" y="40" fill="#35D5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="9" font-weight="400" opacity=".45">0101</text><text x="1090" y="40" fill="#35D5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="9" font-weight="400" opacity=".45">0101</text></g></svg>