<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 68" role="img" aria-label="NCEA AntiCheat graphic">
<title>Cyber data-flow divider</title><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#070914"/><stop offset=".5" stop-color="#090C25"/><stop offset="1" stop-color="#111A40"/></linearGradient>
<linearGradient id="line"><stop stop-color="#5555FF"/><stop offset=".5" stop-color="#8358FF"/><stop offset="1" stop-color="#35D5FF"/></linearGradient>
<filter id="glow" x="-40%" y="-90%" width="180%" height="280%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="clip"><rect x="2" y="2" width="1196" height="64" rx="18"/></clipPath>
</defs><style>@keyframes fall{to{transform:translateY(68px)}}
@keyframes drift{50%{transform:translate(10px,-8px);opacity:.3}}
@keyframes scan{to{transform:translateY(68px)}}
@keyframes pulse{50%{opacity:.42}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes enter{0%{opacity:.22;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@keyframes glitch{2%,96%{transform:translateX(0)}97%{transform:translateX(3px)}98%{transform:translateX(-2px)}99%{transform:translateX(0)}}
.fall{animation:fall 12s linear infinite} .drift{animation:drift 7s ease-in-out infinite}
.scan{animation:scan 7s linear infinite} .pulse{animation:pulse 3s ease-in-out infinite}
.flow{animation:flow 5s linear infinite} .enter{animation:enter 2s ease-out both}
.glitch{animation:glitch 8s linear infinite}
@media (prefers-reduced-motion:reduce){.fall,.drift,.scan,.pulse,.flow,.enter,.glitch{animation:none!important}}</style><rect width="1200" height="68" rx="18" fill="url(#bg)"/>
<g clip-path="url(#clip)"><g opacity=".22"><path d="M0 0V68" fill="none" stroke="#5555FF" stroke-width="1" opacity="0.3" /><path d="M36 0V68" fill="none" stroke="#5555FF" stroke-width="1" opacity="0.3" /><path d="M72 0V68" fill="none" stroke="#5555FF" stroke-width="1" opacity="0.3" /><path d="M108 0V68" fill="none" stroke="#5555FF" stroke-width="1" opacity="0.3" /><path d="M144 0V68" fill="none" stroke="#5555FF" stroke-width="1" opacity="0.3" /><path d="M180 0V68" fill="none" stroke="#5555FF" stroke-width="1" opacity="0.3" /><path d="M216 0V68" fill="none" stroke="#5555FF" stroke-width="1" opacity="0.3" /><path d="M252 0V68" fill="none" stroke="#5555FF" stroke-width="1" opacity="0.3" /><path d="M288 0V68" fill="none" stroke="#5555FF" stroke-width="1" opacity="0.3" /><path d="M324 0V68" fill="none" stroke="#5555FF" stroke-width="1" opacity="0.3" /><path d="M360 0V68" fill="none" stroke="#5555FF" stroke-width="1" opacity="0.3" /><path d="M396 0V68" fill="none" stroke="#5555FF" stroke-width="1" opacity="0.3" /><path d="M432 0V68" fill="none" stroke="#5555FF" stroke-width="1" opacity="0.3" /><path d="M468 0V68" fill="none" stroke="#5555FF" stroke-width="1" opacity="0.3" /><path d="M504 0V68" fill="none" stroke="#5555FF" stroke-width="1" opacity="0.3" /><path d="M540 0V68" fill="none" stroke="#5555FF" stroke-width="1" opacity="0.3" /><path d="M576 0V68" fill="none" stroke="#5555FF" stroke-width="1" opacity="0.3" /><path d="M612 0V68" fill="none" stroke="#5555FF" stroke-width="1" opacity="0.3" /><path d="M648 0V68" fill="none" stroke="#5555FF" stroke-width="1" opacity="0.3" /><path d="M684 0V68" fill="none" stroke="#5555FF" stroke-width="1" opacity="0.3" /><path d="M720 0V68" fill="none" stroke="#5555FF" stroke-width="1" opacity="0.3" /><path d="M756 0V68" fill="none" stroke="#5555FF" stroke-width="1" opacity="0.3" /><path d="M792 0V68" fill="none" stroke="#5555FF" stroke-width="1" opacity="0.3" /><path d="M828 0V68" fill="none" stroke="#5555FF" stroke-width="1" opacity="